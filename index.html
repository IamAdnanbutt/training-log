<style>
  :root{
    --paper:#EBEEF0;
    --card:#FFFFFF;
    --ink:#12171B;
    --muted:#6C7681;
    --line:#D9DEE3;
    --signal:#0E5A4A;
    --signal-soft:#E3EFEC;
    --brass:#8A6A1F;
    --brass-soft:#F4EEDF;
    --sans:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.45;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }

  .wrap{ max-width:560px; margin:0 auto; padding:0 14px; }

  /* ---------- header ---------- */
  .top{
    padding:22px 0 14px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:5px;
  }
  .top h1{ font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .tally{ font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; line-height:1.3; }
  .tally b{ display:block; font-size:19px; color:var(--ink); font-weight:600; }
  .syncdot{ display:none; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .syncdot.on{ display:inline-block; }
  .syncdot.ok{ background:var(--signal); }
  .syncdot.wait{ background:var(--brass); }
  .syncdot.err{ background:#A03A32; }
  .authrow{ display:flex; gap:6px; margin-bottom:8px; }
  .authrow input{ flex:1; height:40px; padding:0 10px; font-size:16px; font-family:var(--mono);
    border:1px solid var(--line); border-radius:8px; background:#FAFBFC; color:var(--ink); }
  .authrow input:focus{ outline:none; border-color:var(--signal); background:#fff; }

  /* ---------- day picker ---------- */
  .days{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:16px; }
  .day{
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:9px 4px 8px; text-align:center; cursor:pointer;
    font-family:inherit; color:var(--ink); transition:background .14s, border-color .14s;
  }
  .day .n{ font-family:var(--mono); font-size:15px; font-weight:600; display:block; }
  .day .t{ font-size:10px; color:var(--muted); letter-spacing:.02em; display:block; margin-top:1px; }
  .day[aria-pressed="true"]{ background:var(--signal); border-color:var(--signal); }
  .day[aria-pressed="true"] .n,
  .day[aria-pressed="true"] .t{ color:#fff; }

  /* ---------- exercise card ---------- */
  .ex{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:9px; overflow:hidden;
  }
  .ex-head{
    display:flex; align-items:flex-start; gap:10px;
    padding:13px 14px 11px; cursor:pointer;
  }
  .ex-head .grow{ flex:1; min-width:0; }
  .ex-name{ font-size:14.5px; font-weight:600; letter-spacing:-.01em; }
  .ex-meta{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:3px; }
  .ex-meta .last{ color:var(--ink); }
  .dots{ display:flex; gap:3px; padding-top:5px; flex-shrink:0; }
  .dot{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--line); }
  .dot.on{ background:var(--muted); border-color:var(--muted); }
  .dot.beat{ background:var(--signal); border-color:var(--signal); }

  .flag{
    display:inline-block; margin-top:6px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.03em;
    background:var(--brass-soft); color:var(--brass);
    padding:3px 7px; border-radius:5px;
  }

  .ex-body{ display:none; padding:0 14px 12px; }
  .ex.open .ex-body{ display:block; }

  .setrow{ display:flex; align-items:center; gap:8px; padding:5px 0; }
  .rail{
    width:3px; height:34px; border-radius:2px;
    background:var(--line); flex-shrink:0; transition:background .16s;
  }
  .rail.on{ background:var(--muted); }
  .rail.beat{ background:var(--signal); }
  .snum{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    width:15px; flex-shrink:0;
  }
  .fld{ flex:1; position:relative; }
  .fld input{
    width:100%; height:38px; padding:0 10px;
    font-family:var(--mono); font-size:16px; font-weight:500;
    border:1px solid var(--line); border-radius:8px;
    background:#FAFBFC; color:var(--ink);
    text-align:center;
  }
  .fld input:focus{ outline:none; border-color:var(--signal); background:#fff; }
  .fld input::placeholder{ color:#B3BBC3; font-weight:400; }
  .unit{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    font-family:var(--mono); font-size:9.5px; color:#B3BBC3; pointer-events:none;
  }

  .ex-tools{ display:flex; gap:7px; margin-top:9px; }
  .tool{
    flex:1; padding:8px 6px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#FAFBFC; color:var(--ink);
    font-family:var(--mono); font-size:11px; letter-spacing:.02em;
  }
  .tool:active{ background:var(--signal-soft); }
  .tool.live{ background:var(--signal); border-color:var(--signal); color:#fff; }
  .tool[disabled]{ opacity:.4; }

  /* ---------- posture ---------- */
  .posture, .panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-top:14px; }
  .posture h3, .panel h3{ margin:0 0 2px; font-size:13.5px; font-weight:600; }
  .posture p, .panel p{ margin:0 0 10px; font-size:11.5px; color:var(--muted); line-height:1.4; }
  .storenote{ font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-top:10px; }
  .seglab{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:2px 0 5px; }
  .seg{ display:flex; gap:6px; margin-bottom:12px; }
  .segb{
    flex:1; padding:9px 0; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#FAFBFC; color:var(--ink);
    font-family:var(--mono); font-size:12.5px; transition:background .14s, border-color .14s;
  }
  .segb[aria-pressed="true"]{ background:var(--signal); border-color:var(--signal); color:#fff; }
  .unitbtn{ flex:0 0 74px; }
  .pitem{ display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  .box{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line);
    flex-shrink:0; display:grid; place-items:center;
    font-size:11px; color:#fff; transition:background .14s, border-color .14s;
  }
  .pitem[aria-pressed="true"] .box{ background:var(--signal); border-color:var(--signal); }
  .pitem span{ font-size:13px; }
  .pitem[aria-pressed="true"] span{ color:var(--muted); text-decoration:line-through; }

  /* ---------- finish bar ---------- */
  .finish{
    position:fixed; left:0; right:0; bottom:calc(56px + env(safe-area-inset-bottom));
    padding:9px 14px; background:linear-gradient(to top, var(--paper) 62%, rgba(235,238,240,0));
    z-index:5;
  }
  .finish-in{ max-width:560px; margin:0 auto; }
  .finish button{
    width:100%; height:46px; border:none; border-radius:10px;
    background:var(--signal); color:#fff; cursor:pointer;
    font-family:var(--sans); font-size:14.5px; font-weight:600; letter-spacing:.01em;
  }
  .finish button[disabled]{ background:#B6BEC5; }

  /* ---------- tabs ---------- */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1; padding:11px 0 12px; text-align:center; cursor:pointer;
    background:none; border:none; font-family:var(--mono);
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  .tab[aria-pressed="true"]{ color:var(--signal); font-weight:600; }

  /* ---------- history / body ---------- */
  .rec{
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:12px 14px; margin-bottom:8px;
  }
  .rec-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .rec-day{ font-size:14px; font-weight:600; }
  .rec-date{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .rec-vol{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:4px; }
  .rec-lines{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line); display:none; }
  .rec.open .rec-lines{ display:block; }
  .rline{ display:flex; justify-content:space-between; gap:12px; font-size:12px; padding:3px 0; }
  .rline .rn{ color:var(--muted); flex:1; min-width:0; }
  .rline .rv{ font-family:var(--mono); font-size:11.5px; white-space:nowrap; }
  .del{
    margin-top:9px; background:none; border:none; cursor:pointer; padding:2px 0;
    font-family:var(--mono); font-size:10.5px; color:#A03A32; letter-spacing:.04em;
  }

  .mform{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:10px 0 12px; }
  .mf label{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px; }
  .mf input{
    width:100%; height:40px; padding:0 10px; text-align:center;
    font-family:var(--mono); font-size:16px;
    border:1px solid var(--line); border-radius:8px; background:#FAFBFC; color:var(--ink);
  }
  .mf input:focus{ outline:none; border-color:var(--signal); background:#fff; }
  .mform button{
    width:100%; height:42px; border:none; border-radius:9px; cursor:pointer;
    background:var(--signal); color:#fff; font-family:var(--sans); font-size:14px; font-weight:600;
  }
  .mrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
  .mrow .md{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .mrow .mv{ font-family:var(--mono); font-size:12.5px; }
  .mv em{ font-style:normal; color:var(--signal); }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:44px 24px; line-height:1.55; }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.5; padding:14px 2px 6px; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(118px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:9px;
    font-family:var(--mono); font-size:11.5px; letter-spacing:.03em;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .timer{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(118px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:9px 14px; border-radius:9px;
    font-family:var(--mono); font-size:13px; z-index:19;
    display:none; align-items:center; gap:11px;
  }
  .timer.show{ display:flex; }
  .timer button{ background:none; border:none; color:#8F9AA3; font-family:var(--mono); font-size:11px; cursor:pointer; padding:0; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<script>
/* ============ program ============ */
const PROGRAM = {
  1:{ label:"Glutes", note:"Hip thrust dominant", ex:[
    {id:"ht",  n:"Barbell / Smith hip thrust", s:4, lo:8,  hi:10, rest:150},
    {id:"rdl", n:"Romanian deadlift (DB)",     s:3, lo:8,  hi:10, rest:120},
    {id:"bss", n:"Bulgarian split squat",      s:3, lo:10, hi:10, rest:90, side:"per leg"},
    {id:"abd", n:"Seated hip abduction",       s:3, lo:15, hi:20, rest:60},
    {id:"bex", n:"45° back extension",         s:3, lo:12, hi:15, rest:60, bw:true},
    {id:"db",  n:"Dead bug",                   s:3, lo:10, hi:10, rest:45, bw:true, side:"per side"}
  ]},
  2:{ label:"Upper", note:"Balanced push / pull", ex:[
    {id:"lpd", n:"Lat pulldown",           s:3, lo:10, hi:12, rest:90},
    {id:"bp",  n:"DB bench / machine press",s:3, lo:10, hi:12, rest:90},
    {id:"row", n:"Seated cable row",       s:3, lo:10, hi:12, rest:90},
    {id:"lat", n:"DB lateral raise",       s:2, lo:12, hi:15, rest:60},
    {id:"fp",  n:"Face pull",              s:2, lo:15, hi:15, rest:60},
    {id:"cur", n:"Bicep curl",             s:2, lo:12, hi:12, rest:45},
    {id:"tri", n:"Triceps pushdown",       s:2, lo:12, hi:12, rest:45},
    {id:"pal", n:"Pallof press",           s:3, lo:10, hi:10, rest:45, side:"per side"}
  ]},
  3:{ label:"Legs", note:"Quad / hamstring emphasis", ex:[
    {id:"gob", n:"Heel-elevated goblet squat", s:3, lo:8,  hi:10, rest:120},
    {id:"lp",  n:"Leg press (feet mid-high)",  s:3, lo:10, hi:12, rest:120},
    {id:"slc", n:"Seated leg curl",            s:3, lo:12, hi:12, rest:90},
    {id:"lun", n:"Walking lunge",              s:2, lo:12, hi:12, rest:90, side:"per leg"},
    {id:"cf",  n:"Standing calf raise",        s:3, lo:15, hi:15, rest:60},
    {id:"rc",  n:"Reverse crunch",             s:3, lo:12, hi:12, rest:45, bw:true}
  ]},
  4:{ label:"Glutes+", note:"Volume day + upper", ex:[
    {id:"slht",n:"Single-leg hip thrust",     s:3, lo:12, hi:15, rest:90, side:"per leg"},
    {id:"pth", n:"Cable pull-through",        s:3, lo:15, hi:15, rest:60},
    {id:"su",  n:"Step-up (knee-height box)", s:3, lo:10, hi:10, rest:90, side:"per leg"},
    {id:"abd2",n:"Hip abduction",             s:3, lo:20, hi:20, rest:45},
    {id:"pu",  n:"Assisted pull-up / pulldown",s:3, lo:10, hi:10, rest:90},
    {id:"ohp", n:"DB shoulder press",         s:2, lo:10, hi:12, rest:60},
    {id:"sp",  n:"Side plank",                s:3, lo:30, hi:30, rest:45, bw:true, time:true, side:"per side"}
  ]}
};

const POSTURE = [
  "Couch stretch — 2 × 45s each side",
  "90/90 hip lift — 3 × 5 breaths",
  "Glute bridge, ribs down — 2 × 15"
];

/* ============ state ============ */
let S = { sessions:[], draft:null, body:[], posture:{}, prefs:{ unit:"kg", tape:"in", ex:{} } };
let tab = "today", saveTimer = null;

const today = () => new Date().toISOString().slice(0,10);
const $ = id => document.getElementById(id);

/* Storage adapter.
   Runs three ways, picking whichever is available:
     cloud  — window.storage, present when opened inside Claude
     local  — localStorage, used when the file is hosted or saved on her own device
     memory — last resort, nothing persists                                  */
const DB = (() => {
  const cloud = !!(window.storage && typeof window.storage.get === "function");
  let local = false;
  if (!cloud){
    try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); local = true; }
    catch(e){ local = false; }
  }
  const mem = {};
  return {
    mode: cloud ? "cloud" : (local ? "local" : "memory"),
    async get(k){
      if (cloud){
        try{ const r = await window.storage.get(k); return r ? r.value : null; }
        catch(e){ return null; }
      }
      if (local){ return localStorage.getItem(k); }
      return mem[k] || null;
    },
    async set(k, v){
      if (cloud){
        try{ await window.storage.set(k, v); return; }catch(e){ return; }
      }
      if (local){
        try{ localStorage.setItem(k, v); return; }catch(e){ return; }
      }
      mem[k] = v;
    }
  };
})();

async function load(){
  const grab = async (k, fb) => {
    const raw = await DB.get(k);
    if (!raw) return fb;
    try{ return JSON.parse(raw); }catch(e){ return fb; }
  };
  S.sessions = await grab("t:sessions", []);
  S.body     = await grab("t:body", []);
  S.posture  = await grab("t:posture", {});
  S.draft    = await grab("t:draft", null);
  const p    = await grab("t:prefs", {});
  S.prefs = { unit: p.unit === "lb" ? "lb" : "kg",
              tape: p.tape === "cm" ? "cm" : "in",
              ex:   (p.ex && typeof p.ex === "object") ? p.ex : {},
              updatedAt: p.updatedAt || 0 };
  migrate();
}

/* Records written before sync existed have no id and no timestamp.
   Merging needs both, so backfill them once, deterministically. */
function migrate(){
  let touched = false;
  S.sessions.forEach((x, i) => {
    if (!x.id){ x.id = (x.date || "0000-00-00") + "-d" + x.day + "-m" + i; touched = true; }
    if (!x.updatedAt){ x.updatedAt = Date.parse(x.date || 0) || 1; touched = true; }
  });
  S.body.forEach(m => { if (!m.updatedAt){ m.updatedAt = Date.parse(m.date || 0) || 1; touched = true; } });
  Object.keys(S.posture).forEach(k => {
    if (Array.isArray(S.posture[k])){ S.posture[k] = { items: S.posture[k], ts: 1 }; touched = true; }
  });
  if (touched) save(["sessions", "body", "posture"]);
}

const postureItems = k => {
  const v = S.posture[k];
  return Array.isArray(v) ? v : (v && Array.isArray(v.items) ? v.items : []);
};

const SYNCED = ["sessions","body","posture","prefs"];
function save(keys){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    for (const k of keys) await DB.set("t:"+k, JSON.stringify(S[k]));
  }, 700);
  if (keys.some(k => SYNCED.includes(k))) queueSync();
}

/* ============ units ============ */
const KG_PER_LB = 0.45359237;

/* Every logged set carries the unit it was entered in, so history stays
   truthful even if the exercise later switches machines. Sets saved before
   this feature existed are assumed kg.                                     */
const setUnit = s => (s && s.u === "lb") ? "lb" : "kg";
const unitFor = exId => S.prefs.ex[exId] === "lb" ? "lb"
                      : S.prefs.ex[exId] === "kg" ? "kg"
                      : S.prefs.unit;

function convert(v, from, to){
  const n = Number(v);
  if (!isFinite(n) || from === to) return n;
  return from === "lb" ? n * KG_PER_LB : n / KG_PER_LB;
}
/* round to something that exists on a real plate or stack */
function tidy(v, u){
  if (!isFinite(v)) return "";
  const r = u === "lb" ? Math.round(v) : Math.round(v * 2) / 2;
  return String(r);
}
/* a set's weight shown in whatever unit that exercise is currently on */
function showW(s, to){
  if (!s || !s.w) return "";
  return tidy(convert(s.w, setUnit(s), to), to);
}
const stepFor = u => u === "lb" ? "5 lb" : "2.5 kg";

const CM_PER_IN = 2.54;
function convTape(v, from, to){
  const n = Number(v);
  if (!isFinite(n) || from === to) return n;
  return from === "in" ? n * CM_PER_IN : n / CM_PER_IN;
}

/* ============ sync ============ */
/* Local storage stays the source of truth for writes, so a dead signal at the
   gym never blocks logging. The cloud is a background mirror.               */
let SY = { mode:"off", email:null, last:0, busy:false, err:null };
let syncTimer = null;

const snapshot = () => ({ sessions:S.sessions, body:S.body, posture:S.posture, prefs:S.prefs });

function applyMerged(m){
  S.sessions = m.sessions || [];
  S.body     = m.body || [];
  S.posture  = m.posture || {};
  if (m.prefs) S.prefs = { unit: m.prefs.unit === "lb" ? "lb" : "kg",
                           tape: m.prefs.tape === "cm" ? "cm" : "in",
                           ex: m.prefs.ex || {}, updatedAt: m.prefs.updatedAt || 0 };
  ["sessions","body","posture","prefs"].forEach(k => DB.set("t:" + k, JSON.stringify(S[k])));
}

function queueSync(){
  if (SY.mode !== "on" || !window.CloudSync) return;
  setDot("wait");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => window.CloudSync.push(), 1200);
}

function setDot(kind){
  const d = $("syncdot");
  if (!d) return;
  d.className = "syncdot" + (SY.mode === "off" ? "" : " on " + kind);
}

/* bridge for the Firebase module, which lives in its own module scope */
window.__app = {
  snapshot, applyMerged, mergeState: null,
  onStatus(patch){
    Object.assign(SY, patch);
    setDot(SY.err ? "err" : SY.busy ? "wait" : "ok");
    if (SY.err && SY.errToast){ toast(SY.err); SY.errToast = false; }
    if (tab === "body") renderBody();
    else if (patch.pulled) render();
  }
};
window.addEventListener("online", () => { if (SY.mode === "on" && window.CloudSync) window.CloudSync.push(); });

/* ============ merge ============ */
/* Two devices editing the same log will conflict. Merging per record rather
   than per blob means a stale laptop can't erase a fresh gym session.
   Ties go to local, which is the device the person is actually holding.   */
function newerOf(a, b, stamp){
  if (!a) return b;
  if (!b) return a;
  return (stamp(b) > stamp(a)) ? b : a;
}

function mergeState(local, remote){
  const ts = x => x.updatedAt || 0;

  const sess = new Map();
  (remote.sessions || []).forEach(x => { if (x && x.id) sess.set(x.id, x); });
  (local.sessions  || []).forEach(x => { if (x && x.id) sess.set(x.id, newerOf(sess.get(x.id), x, ts)); });

  const body = new Map();
  (remote.body || []).forEach(x => { if (x && x.date) body.set(x.date, x); });
  (local.body  || []).forEach(x => { if (x && x.date) body.set(x.date, newerOf(body.get(x.date), x, ts)); });

  const post = {};
  const pts = o => (o && o.ts) || 0;
  [remote.posture || {}, local.posture || {}].forEach(src => {
    Object.entries(src).forEach(([k, v]) => {
      const norm = Array.isArray(v) ? { items: v, ts: 1 } : v;
      post[k] = newerOf(post[k], norm, pts);
    });
  });

  const rp = remote.prefs || {}, lp = local.prefs || {};
  const prefs = (rp.updatedAt || 0) > (lp.updatedAt || 0) ? rp : lp;

  return {
    sessions: [...sess.values()].sort((a, b) =>
      (a.date || "").localeCompare(b.date || "") || String(a.id).localeCompare(String(b.id))),
    body: [...body.values()].sort((a, b) => a.date.localeCompare(b.date)),
    posture: post,
    prefs
  };
}

/* deleted sessions stay as tombstones so the delete propagates instead of
   being undone by the other device pushing its copy back */
const liveSessions = () => S.sessions.filter(x => !x.deleted);
window.__app.mergeState = mergeState;

/* ============ helpers ============ */
function lastFor(dayId, exId){
  for (let i = S.sessions.length - 1; i >= 0; i--){
    const s = S.sessions[i];
    if (s.deleted || s.day !== dayId) continue;
    const sets = (s.log || {})[exId];
    if (sets && sets.some(x => x && x.r)) return sets;
  }
  return null;
}

function fmtLast(sets, ex){
  if (!sets) return null;
  const done = sets.filter(x => x && x.r);
  if (!done.length) return null;
  const u = unitFor(ex.id);
  const ws = [...new Set(done.map(x => x.w ? showW(x, u) : "bw"))];
  const reps = done.map(x => x.r).join(",");
  return (ws.length === 1 ? ws[0] + (ws[0] === "bw" ? "" : " " + u) : "mixed") + " × " + reps;
}

function shouldBump(sets, ex){
  if (!sets) return false;
  const done = sets.filter(x => x && x.r);
  if (done.length < ex.s) return false;
  return done.every(x => Number(x.r) >= ex.hi);
}

/* totals must normalise, or a 100 lb set and a 40 kg set get added together */
function volumeKg(sess){
  let v = 0;
  Object.values(sess.log || {}).forEach(sets => {
    sets.forEach(x => {
      if (x && x.w && x.r) v += convert(x.w, setUnit(x), "kg") * Number(x.r);
    });
  });
  return v;
}
function volumeText(sess){
  const u = S.prefs.unit;
  const v = u === "lb" ? convert(volumeKg(sess), "kg", "lb") : volumeKg(sess);
  return Math.round(v).toLocaleString() + " " + u;
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1900);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============ rest timer ============ */
let tInt = null, tLeft = 0;
function startTimer(sec){
  clearInterval(tInt); tLeft = sec;
  $("timer").classList.add("show");
  const tick = () => {
    const m = Math.floor(tLeft / 60), s = tLeft % 60;
    $("tclock").textContent = m + ":" + String(s).padStart(2, "0");
    if (tLeft <= 0){ clearInterval(tInt); $("tclock").textContent = "rest done"; setTimeout(stopTimer, 2500); }
    tLeft--;
  };
  tick(); tInt = setInterval(tick, 1000);
}
function stopTimer(){ clearInterval(tInt); $("timer").classList.remove("show"); }
$("tskip").onclick = stopTimer;

/* ============ today ============ */
function ensureDraft(dayId){
  if (!S.draft || S.draft.day !== dayId){
    S.draft = { day:dayId, date:today(), log:{}, open:PROGRAM[dayId].ex[0].id };
    save(["draft"]);
  }
}

function renderToday(){
  const dayId = S.draft ? S.draft.day : null;
  $("eyebrow").textContent = dayId ? "Session in progress" : "Training log";
  $("title").textContent = dayId ? "Day " + dayId + " — " + PROGRAM[dayId].label : "Pick a day";
  $("count").textContent = liveSessions().length;

  let h = '<div class="days">';
  for (const k of [1,2,3,4]){
    h += `<button class="day" data-day="${k}" aria-pressed="${String(k)===String(dayId)}">
      <span class="n">${k}</span><span class="t">${PROGRAM[k].label}</span></button>`;
  }
  h += "</div>";

  if (!dayId){
    h += `<div class="empty">Rotate 1 → 2 → rest → 3 → 4 → rest.<br>Don't put Day 1 and Day 3 back to back.</div>`;
    $("view").innerHTML = h;
    $("finishbar").style.display = "none";
    bindDays();
    return;
  }

  PROGRAM[dayId].ex.forEach(ex => {
    const prev = lastFor(dayId, ex.id);
    const cur = (S.draft.log[ex.id]) || [];
    const bump = shouldBump(prev, ex);
    const open = S.draft.open === ex.id;
    const repLabel = ex.time ? "sec" : "reps";
    const u = unitFor(ex.id);

    let dots = "";
    for (let i = 0; i < ex.s; i++){
      const c = cur[i];
      const beat = c && c.r && (!prev || !prev[i] || Number(c.r) >= Number(prev[i].r || 0));
      dots += `<div class="dot ${c && c.r ? (beat ? "beat" : "on") : ""}"></div>`;
    }

    const lastTxt = fmtLast(prev, ex);
    h += `<div class="ex ${open ? "open" : ""}" data-ex="${ex.id}">
      <div class="ex-head" data-toggle="${ex.id}">
        <div class="grow">
          <div class="ex-name">${esc(ex.n)}</div>
          <div class="ex-meta">${ex.s} × ${ex.lo === ex.hi ? ex.lo : ex.lo+"–"+ex.hi}${ex.time?"s":""}${ex.side ? " " + ex.side : ""}
            ${lastTxt ? ' · last <span class="last">' + esc(lastTxt) + "</span>" : ' · no history'}</div>
          ${bump ? `<div class="flag">↑ hit every set — add ${stepFor(u)}</div>` : ""}
        </div>
        <div class="dots">${dots}</div>
      </div>
      <div class="ex-body">`;

    for (let i = 0; i < ex.s; i++){
      const c = cur[i] || {};
      const p = prev && prev[i] ? prev[i] : null;
      const beat = c.r && (!p || Number(c.r) >= Number(p.r || 0));
      h += `<div class="setrow">
        <div class="rail ${c.r ? (beat ? "beat" : "on") : ""}"></div>
        <div class="snum">${i+1}</div>
        <div class="fld">
          <input inputmode="decimal" data-in="w" data-ex="${ex.id}" data-set="${i}"
            value="${c.w || ""}" placeholder="${p && p.w ? showW(p, u) : (ex.bw ? "bw" : "—")}" aria-label="Set ${i+1} weight in ${u}">
          <span class="unit">${u}</span>
        </div>
        <div class="fld">
          <input inputmode="numeric" data-in="r" data-ex="${ex.id}" data-set="${i}"
            value="${c.r || ""}" placeholder="${p && p.r ? p.r : ex.lo}" aria-label="Set ${i+1} ${repLabel}">
          <span class="unit">${ex.time ? "sec" : "rep"}</span>
        </div>
      </div>`;
    }

    h += `<div class="ex-tools">
        <button class="tool" data-repeat="${ex.id}" ${prev ? "" : "disabled"}>Repeat last</button>
        <button class="tool" data-rest="${ex.rest}">Rest ${Math.floor(ex.rest/60)}:${String(ex.rest%60).padStart(2,"0")}</button>
        ${ex.bw ? "" : `<button class="tool unitbtn" data-unit="${ex.id}" aria-label="Switch this exercise to ${u === "kg" ? "pounds" : "kilograms"}">${u} ⇄</button>`}
      </div></div></div>`;
  });

  const pk = "p:" + today();
  const pdone = postureItems(pk);
  h += `<div class="posture"><h3>Posture work</h3>
    <p>Daily, 6 minutes. This is what actually changes how the lower belly sits.</p>`;
  POSTURE.forEach((p, i) => {
    h += `<div class="pitem" data-p="${i}" aria-pressed="${pdone.includes(i)}">
      <div class="box">✓</div><span>${esc(p)}</span></div>`;
  });
  h += "</div>";

  h += `<div class="note">Double progression: when you hit the top of the rep range on <em>every</em> set, add ${stepFor(S.prefs.unit)} next time and start back at the bottom.<br><br>If a machine reads in the other unit, tap the <em>${S.prefs.unit} ⇄</em> button on that exercise — it only changes that one, and it remembers.${DB.mode === "memory" ? "<br><br>This browser is blocking storage, so nothing will be kept once you close the tab. Back up from the History tab before you leave." : ""}</div>`;

  $("view").innerHTML = h;
  $("finishbar").style.display = "";
  const any = Object.values(S.draft.log).some(a => a.some(x => x && x.r));
  $("finishbtn").disabled = !any;
  bindDays(); bindToday();
}

function bindDays(){
  document.querySelectorAll("[data-day]").forEach(b => {
    b.onclick = () => {
      const d = b.dataset.day;
      if (S.draft && S.draft.day === d){ return; }
      const dirty = S.draft && Object.values(S.draft.log).some(a => a.some(x => x && x.r));
      if (dirty && !confirm("Switch day? The sets you've logged will be discarded.")) return;
      ensureDraft(d); renderToday();
    };
  });
}

function bindToday(){
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.toggle;
      S.draft.open = (S.draft.open === id) ? null : id;
      save(["draft"]); renderToday();
    };
  });

  document.querySelectorAll("input[data-in]").forEach(inp => {
    inp.oninput = () => {
      const { ex, set } = inp.dataset, k = inp.dataset.in;
      const val = inp.value.replace(/[^0-9.]/g, "");
      if (val !== inp.value) inp.value = val;
      const d = PROGRAM[S.draft.day].ex.find(e => e.id === ex);
      if (!S.draft.log[ex]) S.draft.log[ex] = new Array(d.s).fill(null);
      const row = S.draft.log[ex][set] || {};
      row[k] = val;
      row.u = unitFor(ex);
      S.draft.log[ex][set] = row;
      save(["draft"]);

      const rail = inp.closest(".setrow").querySelector(".rail");
      const prev = lastFor(S.draft.day, ex);
      const p = prev && prev[set] ? prev[set] : null;
      rail.className = "rail" + (row.r ? (!p || Number(row.r) >= Number(p.r || 0) ? " beat" : " on") : "");
      $("finishbtn").disabled = !Object.values(S.draft.log).some(a => a.some(x => x && x.r));
    };
  });

  document.querySelectorAll("[data-repeat]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.repeat;
      const prev = lastFor(S.draft.day, id);
      if (!prev) return;
      const u = unitFor(id);
      S.draft.log[id] = prev.map(x => x ? { w: showW(x, u), r: x.r, u } : null);
      save(["draft"]); renderToday(); toast("Filled from last session");
    };
  });

  document.querySelectorAll("[data-unit]").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.unit;
      const from = unitFor(id), to = from === "kg" ? "lb" : "kg";
      S.prefs.ex[id] = to;
      S.prefs.updatedAt = Date.now();
      // anything already typed this session gets converted, not reinterpreted
      const rows = S.draft.log[id];
      if (rows) S.draft.log[id] = rows.map(x =>
        x ? { ...x, w: x.w ? tidy(convert(x.w, setUnit(x), to), to) : x.w, u: to } : null);
      save(["prefs", "draft"]); renderToday(); toast("Now logging in " + to);
    };
  });

  document.querySelectorAll("[data-rest]").forEach(b => {
    b.onclick = () => startTimer(Number(b.dataset.rest));
  });

  document.querySelectorAll("[data-p]").forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.p), pk = "p:" + today();
      const arr = postureItems(pk);
      S.posture[pk] = { items: arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i], ts: Date.now() };
      save(["posture"]); queueSync(); renderToday();
    };
  });
}

$("finishbtn").onclick = () => {
  const d = S.draft;
  Object.keys(d.log).forEach(k => {
    d.log[k] = d.log[k].map(x => (x && x.r) ? x : null);
    if (!d.log[k].some(Boolean)) delete d.log[k];
  });
  d.date = today();
  d.id = d.date + "-d" + d.day + "-" + Math.random().toString(36).slice(2, 8);
  d.updatedAt = Date.now();
  S.sessions.push(d);
  S.draft = null;
  save(["sessions", "draft"]);
  stopTimer();
  toast("Session saved");
  renderToday();
};

/* ============ history ============ */
function renderHistory(){
  $("eyebrow").textContent = "History";
  $("title").textContent = "Past sessions";
  $("count").textContent = liveSessions().length;
  $("finishbar").style.display = "none";

  let h = "";
  if (!liveSessions().length){
    h += `<div class="empty">Nothing logged yet.<br>Finish a session and it'll show up here.</div>`;
  }
  [...liveSessions()].reverse().forEach(s => {
    const idx = s.id;
    const P = PROGRAM[s.day];
    const sets = Object.values(s.log).reduce((a, b) => a + b.filter(Boolean).length, 0);
    h += `<div class="rec" data-rec="${idx}">
      <div data-rtoggle="${idx}">
        <div class="rec-top">
          <div class="rec-day">Day ${s.day} — ${P.label}</div>
          <div class="rec-date">${s.date}</div>
        </div>
        <div class="rec-vol">${sets} sets · ${volumeText(s)} total volume</div>
      </div>
      <div class="rec-lines">`;
    P.ex.forEach(ex => {
      const l = s.log[ex.id]; if (!l) return;
      const done = l.filter(Boolean);
      // history shows what she actually entered at the time, not a re-conversion
      const ws = [...new Set(done.map(x => x.w ? x.w + " " + setUnit(x) : "bw"))];
      h += `<div class="rline"><span class="rn">${esc(ex.n)}</span>
        <span class="rv">${ws.length === 1 ? esc(ws[0]) : "mixed"} × ${done.map(x => x.r).join(",")}</span></div>`;
    });
    h += `<button class="del" data-del="${idx}">Delete this session</button></div></div>`;
  });

  const where = DB.mode === "cloud" ? "your Claude account"
              : DB.mode === "local" ? "this browser only"
              : "nowhere — storage is blocked";
  h += `<div class="panel"><h3>Back up</h3>
    <p>Your log lives on this device. Download a copy before you switch phones or clear your browser data.</p>
    <div class="ex-tools">
      <button class="tool" id="expbtn">Download backup</button>
      <button class="tool" id="impbtn">Restore backup</button>
    </div>
    <input type="file" id="impfile" accept="application/json,.json" style="display:none">
    <div class="storenote">Saved to ${where}</div></div>`;

  $("view").innerHTML = h;

  $("expbtn").onclick = () => {
    const data = { v:2, exported:today(), sessions:S.sessions, body:S.body, posture:S.posture, prefs:S.prefs };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "training-log-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Backup downloaded");
  };

  $("impbtn").onclick = () => $("impfile").click();

  $("impfile").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d;
      try{ d = JSON.parse(rd.result); }catch(err){ toast("That file isn't a backup"); return; }
      if (!d || !Array.isArray(d.sessions)){ toast("That file isn't a backup"); return; }
      if (!confirm("Restore this backup? It replaces everything logged on this device.")) return;
      S.sessions = d.sessions;
      S.body = Array.isArray(d.body) ? d.body : [];
      S.posture = d.posture && typeof d.posture === "object" ? d.posture : {};
      if (d.prefs && typeof d.prefs === "object"){
        S.prefs = { unit: d.prefs.unit === "lb" ? "lb" : "kg",
                    tape: d.prefs.tape === "cm" ? "cm" : "in",
                    ex: (d.prefs.ex && typeof d.prefs.ex === "object") ? d.prefs.ex : {} };
      }
      save(["sessions","body","posture","prefs"]);
      renderHistory(); toast("Backup restored");
    };
    rd.readAsText(f);
  };

  document.querySelectorAll("[data-rtoggle]").forEach(el => {
    el.onclick = () => el.closest(".rec").classList.toggle("open");
  });
  document.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      if (!confirm("Delete this session? It can't be undone.")) return;
      const t = S.sessions.find(x => x.id === b.dataset.del);
      if (t){ t.deleted = true; t.updatedAt = Date.now(); }
      save(["sessions"]); queueSync(); renderHistory(); toast("Session deleted");
    };
  });
}

/* ============ body ============ */
const MF = [
  {k:"hip",   l:"Hips (widest)", ph:"36", t:"tape"},
  {k:"thigh", l:"Thigh",         ph:"—",  t:"tape"},
  {k:"waist", l:"Waist (small)", ph:"28", t:"tape"},
  {k:"wt",    l:"Weight",        ph:"49", t:"wt"}
];

const recUnit = (m, f) => f.t === "wt" ? (m.wu === "lb" ? "lb" : "kg")
                                       : (m.tu === "cm" ? "cm" : "in");
const prefUnit = f => f.t === "wt" ? S.prefs.unit : S.prefs.tape;

function bodyVal(m, f, to){
  if (!m[f.k]) return null;
  return f.t === "wt" ? convert(m[f.k], recUnit(m, f), to)
                      : convTape(m[f.k], recUnit(m, f), to);
}

function renderBody(){
  $("eyebrow").textContent = "Measurements";
  $("title").textContent = "Tape, not scale";
  $("count").textContent = S.body.length;
  $("finishbar").style.display = "none";

  let h = `<div class="mform"><div class="mgrid">`;
  MF.forEach(f => {
    h += `<div class="mf"><label for="m-${f.k}">${f.l} (${prefUnit(f)})</label>
      <input id="m-${f.k}" inputmode="decimal" placeholder="${f.ph}"></div>`;
  });
  h += `</div><button id="msave">Save today's numbers</button></div>`;

  if (S.body.length > 1){
    const A = S.body[0], B = S.body[S.body.length - 1];
    const d = f => {
      const u = prefUnit(f);
      const a = bodyVal(A, f, u), b = bodyVal(B, f, u);

      return (v > 0 ? "+" : "") + v;
    };
    h += `<div class="note">Since ${A.date} — hips <em>${d(MF[0])}</em> · thigh <em>${d(MF[1])}</em> · waist <em>${d(MF[2])}</em> ${S.prefs.tape} · weight <em>${d(MF[3])}</em> ${S.prefs.unit}</div>`;
  }

  if (!S.body.length){
    h += `<div class="empty">No measurements yet.<br>Take them once a month, same time of day, before eating.</div>`;
  } else {
    [...S.body].reverse().forEach(m => {
      const parts = MF.filter(f => m[f.k]).map(f =>
        (f.t === "wt" ? "" : f.l.split(" ")[0].toLowerCase() + " ") + m[f.k] + " " + recUnit(m, f));
      h += `<div class="mrow"><span class="md">${m.date}</span>
        <span class="mv">${esc(parts.join("  ·  "))}</span></div>`;
    });
  }

  const overrides = Object.keys(S.prefs.ex).length;
  h += `<div class="panel"><h3>Units</h3>
    <p>The default for weights and measurements. Individual exercises can be switched from their own card — useful when one machine is in lb and the rest of the gym is in kg.</p>
    <div class="seglab">Weight</div>
    <div class="seg">
      <button class="segb" data-pref="unit" data-val="kg" aria-pressed="${S.prefs.unit === "kg"}">kg</button>
      <button class="segb" data-pref="unit" data-val="lb" aria-pressed="${S.prefs.unit === "lb"}">lb</button>
    </div>
    <div class="seglab">Tape</div>
    <div class="seg">
      <button class="segb" data-pref="tape" data-val="in" aria-pressed="${S.prefs.tape === "in"}">inches</button>
      <button class="segb" data-pref="tape" data-val="cm" aria-pressed="${S.prefs.tape === "cm"}">cm</button>
    </div>
    ${overrides ? `<button class="tool" id="clearov">Reset ${overrides} exercise override${overrides > 1 ? "s" : ""} to default</button>` : ""}
    <div class="storenote">Past entries keep the units they were taken in</div></div>`;

  h += syncPanel();

  h += `<div class="note">Hips and thigh going up while the waist holds steady is the plan working — the scale number will drift up and that's fine.</div>`;
  $("view").innerHTML = h;

  bindSync();

  document.querySelectorAll("[data-pref]").forEach(b => {
    b.onclick = () => {
      S.prefs[b.dataset.pref] = b.dataset.val;
      S.prefs.updatedAt = Date.now();
      save(["prefs"]); queueSync(); renderBody();
    };
  });

  const ov = $("clearov");
  if (ov) ov.onclick = () => {
    if (!confirm("Put every exercise back on the default unit?")) return;
    S.prefs.ex = {};
    save(["prefs"]); renderBody(); toast("Overrides cleared");
  };

  $("msave").onclick = () => {
    const rec = { date: today(), wu: S.prefs.unit, tu: S.prefs.tape, updatedAt: Date.now() };
    let any = false;
    MF.forEach(f => {
      const v = $("m-" + f.k).value.trim();
      if (v){ rec[f.k] = v; any = true; }
    });
    if (!any){ toast("Fill in at least one number"); return; }
    const i = S.body.findIndex(x => x.date === rec.date);
    if (i >= 0) S.body[i] = rec; else S.body.push(rec);
    save(["body"]); renderBody(); toast("Measurements saved");
  };
}

/* ============ sync panel ============ */
function syncPanel(){
  const err = SY.err ? `<div class="storenote">${esc(SY.err)}</div>` : "";
  if (SY.mode === "off")
    return `<div class="panel"><h3>Sync</h3>
      <p>Not set up — the log lives on this device only. To turn it on, fill in the FIREBASE_CONFIG block at the top of index.html.</p>${err}</div>`;

  if (SY.mode === "signedout")
    return `<div class="panel"><h3>Sync</h3>
      <p>Sign in to keep this device in step with the others.</p>
      <div class="authrow"><input id="sy-email" type="email" inputmode="email" autocomplete="username" placeholder="email"></div>
      <div class="authrow"><input id="sy-pass" type="password" autocomplete="current-password" placeholder="password"></div>
      <button class="tool" id="sy-in">Sign in</button>${err}</div>`;

  const mins = SY.last ? Math.round((Date.now() - SY.last) / 60000) : null;
  const when = SY.busy ? "syncing…"
             : mins === null ? "not synced yet"
             : mins <= 0 ? "synced just now" : "synced " + mins + "m ago";
  return `<div class="panel"><h3>Sync</h3>
    <p>Signed in as ${esc(SY.email || "")}. Changes save here first, then mirror to the cloud — logging still works with no signal.</p>
    <div class="ex-tools">
      <button class="tool" id="sy-now" ${SY.busy ? "disabled" : ""}>Sync now</button>
      <button class="tool" id="sy-out">Sign out</button>
    </div>
    <div class="storenote">${SY.err ? esc(SY.err) : when}</div></div>`;
}

function bindSync(){
  const inb = $("sy-in");
  if (inb) inb.onclick = () => {
    const e = $("sy-email").value.trim(), pw = $("sy-pass").value;
    if (!e || !pw){ toast("Enter email and password"); return; }
    window.CloudSync && window.CloudSync.signIn(e, pw);
  };
  const now = $("sy-now");
  if (now) now.onclick = () => window.CloudSync && window.CloudSync.push();
  const out = $("sy-out");
  if (out) out.onclick = () => {
    if (!confirm("Sign out? Your log stays on this device.")) return;
    window.CloudSync && window.CloudSync.signOut();
  };
}

/* ============ router ============ */
function render(){
  if (tab === "today") renderToday();
  else if (tab === "history") renderHistory();
  else renderBody();
  window.scrollTo(0, 0);
}

document.querySelectorAll(".tab").forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.tab === tab)));
    render();
  };
});

load().then(render);
</script>

<script type="module">
/* Cloud sync. Optional: with no config the app is untouched and local-only. */
(async () => {
  const app = window.__app;
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.apiKey || !cfg.projectId){ app.onStatus({ mode:"off" }); return; }

  const V = "https://www.gstatic.com/firebasejs/11.0.2/";
  let A, B, C;
  try {
    [A, B, C] = await Promise.all([
      import(V + "firebase-app.js"),
      import(V + "firebase-auth.js"),
      import(V + "firebase-firestore.js")
    ]);
  } catch (e){
    app.onStatus({ mode:"off", err:"Couldn't load Firebase — check your connection.", errToast:true });
    return;
  }

  const fbApp = A.initializeApp(cfg);
  const auth  = B.getAuth(fbApp);
  const db    = C.getFirestore(fbApp);
  let uid = null, busy = false;

  try { await B.setPersistence(auth, B.browserLocalPersistence); } catch (e){}

  const friendly = e => {
    const c = (e && e.code) || "";
    if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
      return "Email or password is wrong.";
    if (c.includes("invalid-email"))      return "That email doesn't look right.";
    if (c.includes("too-many-requests"))  return "Too many tries — wait a minute.";
    if (c.includes("network"))            return "No connection — saved here, will sync later.";
    if (c.includes("unavailable"))        return "Offline — saved here, will sync later.";
    if (c.includes("permission-denied"))  return "Firestore rules are blocking this account.";
    return (e && e.message) ? e.message.replace(/^Firebase:\s*/, "") : "Sync failed.";
  };

  /* One transaction does read + merge + write, so two devices saving at the
     same moment serialise instead of overwriting each other.               */
  async function push(){
    if (!uid || busy) return;
    busy = true;
    app.onStatus({ busy:true, err:null });
    try {
      const ref = C.doc(db, "users", uid);
      const merged = await C.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        let remote = {};
        if (snap.exists()){
          try { remote = JSON.parse(snap.data().blob || "{}"); } catch (e){ remote = {}; }
        }
        const m = app.mergeState(app.snapshot(), remote);
        tx.set(ref, { blob: JSON.stringify(m), updatedAt: Date.now() });
        return m;
      });
      app.applyMerged(merged);
      busy = false;
      app.onStatus({ mode:"on", busy:false, last:Date.now(), err:null, pulled:true });
    } catch (e){
      busy = false;
      app.onStatus({ busy:false, err:friendly(e), errToast:true });
    }
  }

  window.CloudSync = {
    push,
    async signIn(email, pw){
      app.onStatus({ busy:true, err:null });
      try { await B.signInWithEmailAndPassword(auth, email, pw); }
      catch (e){ app.onStatus({ busy:false, err:friendly(e), errToast:true }); }
    },
    async signOut(){
      try { await B.signOut(auth); } catch (e){}
    }
  };

  B.onAuthStateChanged(auth, u => {
    uid = u ? u.uid : null;
    if (u){ app.onStatus({ mode:"on", email:u.email, err:null }); push(); }
    else  { app.onStatus({ mode:"signedout", email:null, last:0 }); }
  });
})();
</script>
